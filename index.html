<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Field 粒子交互场</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05070d; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
  .hint {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(100, 217, 254, 0.5);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.8rem;
    letter-spacing: 1px;
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">移动鼠标 · 点击爆发</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// 鼠标
const mouse = { x: W / 2, y: H / 2, active: false };
window.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});
window.addEventListener('mouseleave', () => mouse.active = false);

// 触摸
window.addEventListener('touchmove', e => {
  const t = e.touches[0];
  mouse.x = t.clientX;
  mouse.y = t.clientY;
  mouse.active = true;
}, { passive: true });
window.addEventListener('touchstart', e => {
  const t = e.touches[0];
  mouse.x = t.clientX;
  mouse.y = t.clientY;
  mouse.active = true;
  burst(mouse.x, mouse.y);
}, { passive: true });

// 粒子
const particles = [];
const MAX = 600;

class Particle {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 1.2 + 0.2;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.life = 1;
    this.decay = Math.random() * 0.008 + 0.003;
    this.size = Math.random() * 2 + 1;
    this.hue = 190 + Math.random() * 40; // 蓝青色系
  }
  update() {
    // 鼠标吸引
    if (mouse.active) {
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 180 && dist > 0.1) {
        const force = (180 - dist) / 180 * 0.06;
        this.vx += (dx / dist) * force;
        this.vy += (dy / dist) * force;
      }
    }
    this.vx *= 0.985;
    this.vy *= 0.985;
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
  }
  draw() {
    const alpha = Math.max(this.life, 0);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * alpha, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue}, 90%, 65%, ${alpha})`;
    ctx.shadowBlur = 12;
    ctx.shadowColor = `hsla(${this.hue}, 90%, 65%, ${alpha * 0.8})`;
    ctx.fill();
  }
}

// 点击爆发
function burst(x, y) {
  const count = 60;
  for (let i = 0; i < count; i++) {
    if (particles.length >= MAX) particles.shift();
    const p = new Particle(x, y);
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
    const speed = Math.random() * 5 + 2;
    p.vx = Math.cos(angle) * speed;
    p.vy = Math.sin(angle) * speed;
    p.decay = Math.random() * 0.015 + 0.008;
    particles.push(p);
  }
}
window.addEventListener('click', e => burst(e.clientX, e.clientY));

// 持续生成
function spawn() {
  if (particles.length < MAX) {
    const p = new Particle(
      Math.random() * W,
      Math.random() * H
    );
    p.decay = Math.random() * 0.004 + 0.002;
    particles.push(p);
  }
}

// 拖尾
function fade() {
  ctx.fillStyle = 'rgba(5, 7, 13, 0.12)';
  ctx.fillRect(0, 0, W, H);
}

function loop() {
  fade();
  spawn();
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.update();
    p.draw();
    if (p.life <= 0) particles.splice(i, 1);
  }
  ctx.shadowBlur = 0;
  requestAnimationFrame(loop);
}

// 初始生成一批
for (let i = 0; i < 200; i++) spawn();

loop();
</script>
</body>
</html>
